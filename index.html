<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浄化療法 実践サポート</title>
<meta name="description" content="3級テキストと岡田先生の論述に基づき、本日の症状から探査する箇所・毒素の流れ・岡田先生の見解・施術の時間配分を示す実践サポートアプリ">
<meta name="theme-color" content="#3f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="浄化療法">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/style.css">
</head>
<body>

<!-- タイトル画面 -->
<section id="title-screen" class="title-screen">
  <div class="title-inner">
    <p class="title-kicker">岡田式浄化療法</p>
    <h1 class="title-name">浄化療法<br>実践サポート</h1>
    <p class="title-lead">3級テキストと岡田先生の論述に基づく<br>探査と施術の手引き</p>
    <button id="tap-start" class="tap-start" type="button">はじめる</button>
    <p class="title-hint">画面のどこを触っても始まります</p>
  </div>
</section>

<header class="top" hidden>
  <button type="button" id="home-btn" class="brand" aria-label="ホームへ">
    <span class="brand-mark" aria-hidden="true">浄</span><span class="brand-name"><b>浄化療法</b><small>実践サポート</small></span>
  </button>
  <div class="top-actions">
    <button type="button" id="size-btn" class="icon-btn" aria-label="文字の大きさを変える"><span class="size-a" aria-hidden="true">あ</span><span class="icon-label">文字</span></button>
    <button type="button" id="music-btn" class="icon-btn" aria-label="音楽"><span class="size-a" aria-hidden="true">♪</span><span class="icon-label">音楽</span></button>
    <button type="button" id="settings-btn" class="icon-btn" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg><span class="icon-label">設定</span></button>
  </div>
</header>

<main hidden>
  <section id="tab-home" class="tab-panel"></section>

  <section id="tab-today" class="tab-panel" hidden>
    <div id="today-form"></div>
    <div id="result" aria-live="polite"></div>
  </section>

  <section id="tab-session" class="tab-panel" hidden></section>
  <section id="tab-records" class="tab-panel" hidden></section>
  <section id="tab-learn" class="tab-panel" hidden>
    <div class="seg" role="tablist" aria-label="学ぶ・調べる">
      <button type="button" role="tab" data-learn="kenkai">岡田先生の見解</button>
      <button type="button" role="tab" data-learn="points">探査箇所</button>
      <button type="button" role="tab" data-learn="flows">流れと用語</button>
      <button type="button" role="tab" data-learn="knowledge">岡田先生の知見</button>
      <button type="button" role="tab" data-learn="practice">実践の心得</button>
      <button type="button" role="tab" data-learn="guide">使い方</button>
    </div>
    <div id="tab-kenkai" class="learn-panel" hidden></div>
    <div id="tab-points" class="learn-panel" hidden></div>
    <div id="learn-flows" class="learn-panel" hidden></div>
    <div id="learn-knowledge" class="learn-panel" hidden></div>
    <div id="learn-practice" class="learn-panel" hidden></div>
    <div id="learn-guide" class="learn-panel" hidden></div>
  </section>
  <section id="tab-settings" class="tab-panel" hidden></section>

  <p id="always-note" class="always-note"></p>
</main>

<nav class="bottom-nav" aria-label="メニュー" hidden>
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg><span>ホーム</span></button>
  <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.4"/><path d="M12 8v7M8 10.5l4-1.5 4 1.5M9.5 21l2.5-6 2.5 6"/></svg><span>つらい所</span></button>
  <button type="button" data-tab="session"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.5l3 2M9.5 3h5"/></svg><span>施術</span></button>
  <button type="button" data-tab="records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg><span>記録</span></button>
  <button type="button" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4 3.5-6 6.5-6 10a6 6 0 0 0 12 0c0-3.5-2-6.5-6-10z"/><path d="M12 9v10"/></svg><span>学ぶ・見解</span></button>
</nav>

<div id="load-error" class="card warn" hidden>データを読み込めませんでした。GitHub Pages など Web サーバー上で開いてください。</div>

<script type="module" src="app/app.js"></script>
</body>
</html>
